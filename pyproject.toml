[project]
name = "pyncmapi"
version = "0.1.0"
description = "NetEase Cloud Music API - Python implementation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "cryptography>=44.0.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "mutagen>=1.47.0",
    "pycryptodome>=3.23.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "qrcode[pil]>=8.2",
    "uvicorn[standard]>=0.46.0",
    "ruff>=0.8.5",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
